[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-snakehole"
version = "0.5.0"
description = "Temporary, code-paired SSH as a Python library"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiortc==1.15.0",
    "aioice==0.10.2",
    "av==17.0.0",
    "pylibsrtp==1.0.0",
    "pyopenssl==26.4.0",
    "asyncssh==2.24.1",
    "bcrypt==5.0.0",
    "cryptography==50.0.2",
    "PyNaCl==1.6.2",
    "spake2==0.9",
    "wsproto==1.3.2",
    "h11==0.16.0",
    "certifi==2026.7.22",
    "pywinpty==3.0.5; sys_platform == 'win32'",
    "ptyprocess==0.7.0; sys_platform != 'win32'",
]
license = "MIT"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["ssh_snakehole*"]

[tool.setuptools.package-data]
ssh_snakehole = ["*.json", "licenses/*", "py.typed"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["docs/temp", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["ssh_snakehole"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["spake2", "spake2.*", "winpty", "ptyprocess"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ssh_snakehole.client", "ssh_snakehole.host", "ssh_snakehole.ticket"]
disallow_untyped_defs = true
