name: Check
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build ruff==0.16.10 mypy==2.4.0
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: 'python -m pip install --only-binary=:all: .'
      - run: python -m mypy
      - run: python -m build
      - run: python -I -m unittest discover -s tests -v
      - run: python tools/audit_runtime.py
      - run: python -m ssh_snakehole version
  nat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: .'
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables
      - run: sudo install -m 644 tests/nat_lab.py /var/tmp/ssh-snakehole-nat-lab.py
      - run: sudo "$(command -v python)" -I /var/tmp/ssh-snakehole-nat-lab.py
